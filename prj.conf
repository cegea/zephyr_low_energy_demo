# Configuracion unica de la demo.
CONFIG_ADC=y
CONFIG_PM=y
CONFIG_PM_POLICY_DEFAULT=y
CONFIG_TICKLESS_KERNEL=y # asi indicamos que no queremos la interrupcion periodica del tick cada 250 us.
# El driver del tick de bajo consumo LPTIM1 usa el controlador reset de STM32.
CONFIG_RESET=y

# El ADC del STM32WL debe suspenderse y reinicializarse alrededor de STOP.
# Sin PM de dispositivos, la segunda conversion despues de STOP se bloquea
# (zephyrproject-rtos/zephyr#37352). El driver ADC 4.4.2 ya implementa estas
# operaciones cuando la gestion system-managed esta habilitada.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_PM_DEVICE_RUNTIME=n

# No se usa radio, BLE, red, LED ni logging.
CONFIG_LOG=n
CONFIG_GPIO=y

# Una lectura cada 5 s y salida permanente por el monitor serie. Un intervalo
# largo deja la placa varios segundos seguidos en el mismo estado, para que el
# multimetro (que promedia unas pocas lecturas por segundo) se estabilice en la
# corriente de ese estado y no en una mezcla con cada despertar.
CONFIG_DEMO_SAMPLE_INTERVAL_MS=5000
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n

CONFIG_ASSERT=y
CONFIG_DEBUG=n
